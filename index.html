  <!-- Opening: the OSCAR mark on a clean page for about a second, then the site fades in. Once per visit; skipped with reduced motion.
       The logo loads only when the opening actually shows. -->
  <div class="intro" id="intro" aria-hidden="true" hidden>
    <div class="intro-inner"><img class="intro-logo" data-src="assets/img/logo/logo-full-mono.png" alt="" width="354" height="480"><p class="intro-tag"></p></div>
  </div>
  <script>
    (function () {
      var el = document.getElementById("intro");
      try { if (window.sessionStorage.getItem("oscar.intro")) return; } catch (e) { /* storage unavailable: show it */ }
      try {
        if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
        var a = JSON.parse(window.localStorage.getItem("oscar.a11y") || "{}");
        if (a && a.still) return;
      } catch (e) { /* no saved settings */ }
      var logo = el.querySelector("img[data-src]");
      if (logo) logo.src = logo.getAttribute("data-src");
      el.hidden = false;
      document.documentElement.classList.add("intro-hold");
    })();
  </script>
